[build]
  command  = "npm run build"
  publish  = "dist"

[build.environment]
  # Astro 6 requires Node >= 22.12.0
  NODE_VERSION = "22.12.0"

# Long-cache static assets that have hashed filenames; keep HTML un-cached
# so the owner sees content edits immediately after a deploy.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers (modest defaults)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

# Redirects: preserve the old GoDaddy URLs so existing inbound links and
# search-engine results don't break after migration.
[[redirects]]
  from = "/about-retrotype"
  to   = "/"
  status = 301

[[redirects]]
  from = "/stock-available-via-etsy"
  to   = "/stock"
  status = 301

[[redirects]]
  from = "/a-z-archive"
  to   = "/archive"
  status = 301

[[redirects]]
  from = "/blogs%2C-manuals-%26-info-1"
  to   = "/info"
  status = 301

[[redirects]]
  from = "/blogs,-manuals-&-info-1"
  to   = "/info"
  status = 301
